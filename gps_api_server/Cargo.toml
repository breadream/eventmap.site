[package]
name = "api_server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.1"
actix-web = "4.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
num-format = "0.4.4"
postgis = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
